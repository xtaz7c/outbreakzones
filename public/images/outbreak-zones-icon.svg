<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Outbreak Zones — ícone</title>
  <desc id="desc">Emblema hexagonal de sobrevivência com símbolo de infecção estilizado, em metal envelhecido e vermelho escuro.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eee6"/>
      <stop offset=".48" stop-color="#a9aaa5"/>
      <stop offset="1" stop-color="#555b5b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c33a36"/>
      <stop offset="1" stop-color="#641317"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="10" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="wear" width="38" height="34" patternUnits="userSpaceOnUse">
      <path d="M3 8h9m13 17h7M18 3h4M4 30h5" stroke="#171a1a" stroke-width="2.5" opacity=".42"/>
      <circle cx="30" cy="8" r="1.6" fill="#f4f0e7" opacity=".4"/>
      <circle cx="14" cy="20" r="1.2" fill="#171a1a" opacity=".5"/>
    </pattern>
    <clipPath id="shieldClip">
      <path d="M256 45 421 139 421 329 256 455 91 329 91 139Z"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <path d="M256 30 435 132 435 343 256 482 77 343 77 132Z"
          fill="#171a1b" stroke="#e5e1d7" stroke-width="12" stroke-linejoin="round"/>
    <path d="M256 55 410 144 410 329 256 448 102 329 102 144Z"
          fill="none" stroke="#8f2025" stroke-width="9" stroke-linejoin="round"/>
    <path d="M256 78 389 155 389 314 256 419 123 314 123 155Z"
          fill="#24292a" stroke="#747a78" stroke-width="5" stroke-linejoin="round"/>

    <!-- abstract infected biohazard / warning mark -->
    <path d="M256 126 294 194 371 205 316 260 329 337 256 301 183 337 196 260 141 205 218 194Z"
          fill="url(#red)" stroke="#e8e3d8" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="256" cy="239" r="27" fill="#171a1b" stroke="#e8e3d8" stroke-width="7"/>
    <path d="M256 160v44M256 275v45M177 218l48 13M287 244l48 13"
          stroke="#f0ece2" stroke-width="12" stroke-linecap="square"/>
    <path d="m205 184 18 10m84 92 18 10m-120 0 18-10m84-92 18-10"
          stroke="#651519" stroke-width="8"/>

    <g clip-path="url(#shieldClip)" opacity=".58">
      <rect x="70" y="25" width="372" height="470" fill="url(#wear)"/>
    </g>
  </g>

  <!-- small hazard notches -->
  <g fill="#b12c2e">
    <path d="m64 112 29 17-29 5Z"/>
    <path d="m448 112-29 17 29 5Z"/>
    <path d="m64 366 29-17-29-5Z"/>
    <path d="m448 366-29-17 29-5Z"/>
  </g>
  <g stroke="#e2ded4" stroke-width="5" opacity=".85">
    <path d="m132 115 25 14m198 254 25 14M380 115l-25 14M132 383l25-14"/>
  </g>
</svg>
