<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111415" />
  <title>Outbreak Zones — Launcher</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#eee9df;background:#111415;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate;background:#111415}.wallpaper{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#111415}.wallpaper img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.48)}.wallpaper::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,14,.55),rgba(8,10,14,.2)),linear-gradient(0deg,rgba(8,10,14,.48),rgba(8,10,14,.12))}
    button,select{font:inherit}button{cursor:pointer}
    .launcher{width:min(620px,calc(100% - 36px));padding:24px;border:1px solid #343b39;background:rgba(17,21,23,.88);backdrop-filter:blur(8px);box-shadow:0 24px 80px #000b}
    header{display:flex;align-items:center;gap:14px}
    .game-icon{width:54px;height:54px;display:block;object-fit:cover;border:1px solid #d45a52;flex:0 0 auto}
    .brand{flex:1;font-size:18px;font-weight:900;letter-spacing:1.4px}.brand span{color:#d44a43}
    .launcher-version{color:#8d9691;font:11px monospace;text-align:right}
    .settings{width:38px;height:38px;border:1px solid #454d49;background:#202727;color:#e8e3d8;font-size:19px}
    .settings:hover{border-color:#c33a36;color:#fff}
    .divider{height:1px;background:#343b39;margin:22px 0}
    .main-action{display:flex;align-items:center;gap:18px}
    .play{flex:1;min-height:64px;border:0;background:#ad3032;color:white;font-size:17px;font-weight:900;letter-spacing:1.5px}
    .play:hover:not(:disabled){background:#c23b3d}.play:disabled{opacity:.45;cursor:not-allowed}
    .game-version{min-width:110px;color:#8d9691;font:11px monospace;text-align:right}
    .game-version strong{display:block;margin-top:5px;color:#eee9df;font-size:14px}
    .message{min-height:18px;margin:14px 0 0;color:#9ca59f;font-size:12px;line-height:1.5}
    .message.error{color:#e58b83}
    .settings-panel{display:none;margin-top:20px;padding-top:18px;border-top:1px solid #343b39}
    .settings-panel.open{display:block}
    .settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    h2{margin:0;font-size:15px}.close{border:0;background:transparent;color:#a8aca4;font-size:22px}
    .field{margin:0 0 16px}.field label{display:block;margin-bottom:8px;color:#9ba39d;font-size:10px;font-weight:700;letter-spacing:1px}
    select{width:100%;padding:12px;background:#111415;color:#eee9df;border:1px solid #4a534e}
    .preference{display:flex;align-items:center;gap:9px;margin:16px 0;color:#c4c9c2;font-size:12px}
    .preference input{accent-color:#bd3738;width:16px;height:16px}
    .actions{display:flex;gap:9px;flex-wrap:wrap}
    .secondary{padding:11px 14px;border:1px solid #555e58;background:transparent;color:#eee9df;font-size:11px;font-weight:800;letter-spacing:.5px}
    .secondary:hover{border-color:#c33a36}.secondary:disabled{opacity:.45;cursor:not-allowed}
    .status{margin:12px 0 0;color:#8d9691;font-size:11px}
    @media(max-width:480px){.launcher{padding:18px}.brand{font-size:15px}.game-icon{width:46px;height:46px}.main-action{gap:12px}.game-version{min-width:88px}}
  </style>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><img src="./images/wallpaper_launcher_cidade_noite_1920x1080.png" alt="" /></div>
  <main class="launcher">
    <header>
      <img class="game-icon" src="./images/icone_game_zumbi_512.png" alt="Outbreak Zones" />
      <div class="brand">OUTBREAK <span>ZONES</span></div>
      <div class="launcher-version">LAUNCHER<strong>v0.1.0</strong></div>
      <button class="settings" id="settings-toggle" type="button" aria-label="Configurações" title="Configurações">⚙</button>
    </header>

    <div class="divider"></div>

    <section class="main-action" aria-label="Iniciar jogo">
      <button class="play" id="play" type="button" disabled>PLAY</button>
      <div class="game-version">GAME VERSION<strong id="current-version">—</strong></div>
    </section>
    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="settings-panel" id="settings-panel" aria-label="Configurações do launcher">
      <div class="settings-head"><h2>Configurações</h2><button class="close" id="settings-close" type="button" aria-label="Fechar">×</button></div>
      <div class="field">
        <label for="version-select">VERSÃO DO JOGO</label>
        <select id="version-select"><option value="">Carregando versões…</option></select>
      </div>
      <label class="preference"><input id="latest-default" type="checkbox" checked /> Usar a última versão lançada por padrão</label>
      <div class="actions">
        <button class="secondary" id="save-version" type="button" disabled>APLICAR VERSÃO</button>
        <button class="secondary" id="refresh" type="button">VERIFICAR ATUALIZAÇÕES</button>
        <button class="secondary" id="install" type="button" disabled>INSTALAR VERSÃO SELECIONADA</button>
      </div>
      <p class="status" id="connection">Aguardando verificação…</p>
    </section>
  </main>
  <script type="module" src="./launcher.js"></script>
</body>
</html>
