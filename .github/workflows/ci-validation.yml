name: Baseline validation

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        if: always()
        run: npm run lint
      - name: Build production bundle
        if: always()
        run: npm run build
