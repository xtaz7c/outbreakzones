name: Linux Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file zip \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-bin patchelf libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend
        run: |
          npm test
          npm run lint
          npm run build

      - name: Validate release version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag $TAG_VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          }

      - name: Package versioned game archive
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qr "../outbreak-zones-game-${VERSION}.zip" .
          cd ..
          sha256sum "outbreak-zones-game-${VERSION}.zip" > "outbreak-zones-game-${VERSION}.zip.sha256"

      - name: Generate application icon
        run: bash scripts/generate-linux-icon.sh

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build native Linux packages
        run: cargo tauri build --bundles deb,appimage

      - name: Upload Linux packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: outbreak-zones-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            outbreak-zones-game-*.zip
            outbreak-zones-game-*.zip.sha256
